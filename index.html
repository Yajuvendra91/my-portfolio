<header>

  <!-- Right Side: Startup Valuation Calculator -->
  <div class="calculator-section">
    <h2>Startup Valuation Calculator</h2>
    <form id="valuationForm">
      <input type="text" name="startupName" placeholder="Startup Name" required>
      <input type="text" name="founderName" placeholder="Founder Name" required>
      <input type="text" name="city" placeholder="City" required>
      <input type="email" name="email" placeholder="Email" required>

      <label for="stage">Stage</label>
      <select id="stage" required>
        <option value="0.5">Idea</option>
        <option value="1.0">Prototype</option>
        <option value="2.0">Early Traction</option>
        <option value="4.0">Scaling</option>
        <option value="6.0">Established</option>
      </select>

      <input type="number" id="annualRevenue" placeholder="Annual Revenue (₹)" required>
      <input type="number" id="growthPercent" placeholder="Growth (%)" required>

      <button type="button" onclick="calculateValuation()">Calculate Valuation</button>

<script>
function calculateValuation() {
  const revenue = parseFloat(document.getElementById('annualRevenue').value) || 0;
  const growthPercent = parseFloat(document.getElementById('growthPercent').value) || 0;
  const stageMultiplier = parseFloat(document.getElementById('stage').value) || 1;

  const growthFactor = 1 + (growthPercent / 100);
  const valuation = revenue * growthFactor * stageMultiplier;

  document.getElementById('valuationResult').innerHTML = `
    <h3>Estimated Valuation:</h3>
    <p style="font-size:1.6em; color:#009688; font-weight:bold;">₹ ${valuation.toLocaleString()}</p>
    <p><strong>Growth Factor:</strong> ${growthFactor.toFixed(2)}</p>
    <p><strong>Stage Multiplier:</strong> ${stageMultiplier}</p>
  `;
}
</script>

<!-- Counter Animation -->
<script>
  const counters = document.querySelectorAll('.counter-number');
  counters.forEach(counter => {
    const updateCount = () => {
      const target = +counter.getAttribute('data-count');
      const count = +counter.innerText;
      const speed = 200; 
      const increment = target / speed;
      if(count < target){
        counter.innerText = Math.ceil(count + increment);
        setTimeout(updateCount, 20);
      } else {
        counter.innerText = target.toLocaleString();
      }
    };
    updateCount();
  });
</script>
