<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Due Diligence | Yajuvendrasingh Chauhan</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 50px;
      flex-wrap: wrap;
    }
    .profile {
      flex: 1;
      max-width: 400px;
      text-align: center;
    }
    .profile img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
    .profile h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .profile p {
      color: #666;
      font-size: 14px;
    }
    .calculator {
      flex: 1;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 450px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 25px;
      background: #e9f7ef;
      border-left: 5px solid #28a745;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile -->
    <div class="profile">
      <img src="https://avatars.githubusercontent.com/u/yourphoto" alt="Yajuvendrasingh Chauhan" />
      <h1>Yajuvendrasingh Chauhan</h1>
      <p>Startup & MSME Consultant | Incubation Expert | Founder - EzillionHub</p>
      <p><b>Key Achievements:</b><br>
      🏢 Mentored 150+ Startups<br>
      💰 Helped raise ₹5 Cr+ in early-stage funding<br>
      🧠 Associated with 4+ leading incubators<br>
      🌐 Founder of innovation platform - EzillionHub</p>
    </div>

    <!-- Due Diligence Calculator -->
    <div class="calculator">
      <h2>Startup Due Diligence Check</h2>
      <form id="ddForm">
        <label>Startup Name:</label>
        <input type="text" id="startupName" required>

        <label>Founder Name:</label>
        <input type="text" id="founderName" required>

        <label>Stage:</label>
        <select id="stage" required>
          <option value="Idea">Idea</option>
          <option value="Prototype">Prototype</option>
          <option value="Early Traction">Early Traction</option>
          <option value="Scaling">Scaling</option>
          <option value="Established">Established</option>
        </select>

        <label>Client Base (Number of Clients):</label>
        <input type="number" id="clients" required>

        <label>Annual Revenue (₹):</label>
        <input type="number" id="revenue" required>

        <label>Growth Percentage (%):</label>
        <input type="number" id="growth" required>

        <button type="button" onclick="calculateDD()">Calculate</button>
      </form>

      <div id="result"></div>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwqRuvI5D_Df_XXSDJkBu36yxjBgdTRT6PJ0lNuClipcKQsHvEE_aWhbsjudXEWQ5_Zjg/exec";

    function calculateDD() {
      const name = document.getElementById("startupName").value;
      const founder = document.getElementById("founderName").value;
      const stage = document.getElementById("stage").value;
      const clients = parseInt(document.getElementById("clients").value);
      const revenue = parseFloat(document.getElementById("revenue").value);
      const growth = parseFloat(document.getElementById("growth").value);

      // Stage multipliers
      const stageMultiplier = {
        "Idea": 0.5,
        "Prototype": 1.0,
        "Early Traction": 2.0,
        "Scaling": 4.0,
        "Established": 6.0
      };

      const growthFactor = 1 + (growth / 100);
      const ddScore = (clients * growthFactor * stageMultiplier[stage]) + (revenue / 100000);

      let status = "";
      if (ddScore < 50) status = "High Risk";
      else if (ddScore < 150) status = "Moderate Potential";
      else status = "Promising Startup";

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `
        <h3>Due Diligence Summary</h3>
        <p><b>Startup:</b> ${name}</p>
        <p><b>Founder:</b> ${founder}</p>
        <p><b>Stage:</b> ${stage}</p>
        <p><b>DD Score:</b> ${ddScore.toFixed(2)}</p>
        <p><b>Status:</b> ${status}</p>
      `;

      // Save to Google Sheet
      fetch(scriptURL, {
        method: "POST",
        body: new FormData(document.getElementById("ddForm")),
      }).catch((err) => console.log("Error:", err));
    }
  </script>

</body>
</html>
